<!DOCTYPE html>
<html>
<head>
<title>Mess Face Recognition System</title>

<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Arial;background:#f4f6fb;padding:20px}
.container{display:flex;gap:20px}
.left,.right{background:#fff;padding:15px;border-radius:10px}
.left{width:65%}
.right{width:35%}
img{width:100%;height:360px;object-fit:cover;border-radius:10px;background:#000}
button{padding:10px 20px;margin:5px}
.day{border:1px solid #ddd;padding:8px;margin-bottom:8px;border-radius:6px}
.rating button{width:40px}
canvas{margin-top:10px}
</style>
</head>

<body>

<h2>Mess Face Recognition System</h2>

<div class="container">
<div class="left">
<h3>Live Camera</h3>
<img src="/video">
<p>Status: <span id="status">Stopped</span></p>
<button onclick="startCam()">Start</button>
<button onclick="stopCam()">Stop</button>

<h3>Mess Feedback</h3>
<div class="rating">
<button onclick="rate(1)">1</button>
<button onclick="rate(2)">2</button>
<button onclick="rate(3)">3</button>
<button onclick="rate(4)">4</button>
<button onclick="rate(5)">5</button>
</div>

<h3>Feedback Gauge</h3>
<canvas id="gauge" width="200" height="120"></canvas>
<p style="text-align:center;font-weight:bold">
Average Rating: <span id="avgText">0</span> / 5
</p>
</div>

<div class="right">
<h3>Weekly Attendance</h3>
<div id="week"></div>
</div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
